name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      # Keep the existing required "quality" check while exercising both
      # supported Node families, including the jsdom/Web Storage boundary.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check

  # TheRSS ships as a macOS Electron app, so the Electron E2E flow and the packaged
  # smoke check cannot run on the ubuntu quality job. Without this job both gates
  # are local-only rituals and can regress unnoticed between manual runs.
  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Build once and reuse it for both gates; `test:e2e` and `package:mac` would
      # otherwise each trigger their own rebuild.
      - run: npm run build

      - name: Electron end-to-end flow
        run: npx playwright test

      # CI verifies real native controls in disposable profiles. Local release QA
      # separately requires WindowServer screenshots and visual inspection.
      - name: Complete AppKit behavior
        env:
          THERSS_NATIVE_DEFAULT_ONLY: '1'
          THERSS_NATIVE_SCREENSHOTS: '0'
        run: node scripts/smoke-native-appkit.mjs && node scripts/smoke-appkit-controls.mjs

      - name: Package unsigned macOS build
        run: npx electron-builder --mac dir

      - name: Packaged app smoke
        env:
          THERSS_NATIVE_SCREENSHOTS: '0'
        run: npm run smoke:package

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
